<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Live Studio / X (a stand-in page for tests: the shape of the real page, none of its content)</title>
<style>
  /* Everything OUTSIDE the chat card is magenta, so a test can tell whether any of it shows. The card is teal, its typing row navy. */
  html, body { margin: 0; background: #ff00ff; color: #fff; font-family: sans-serif }
  .page { position: relative; width: 100%; height: 2600px }
  .side, .details, .charts { position: absolute; background: #ff00ff }
  .side { left: 0; top: 0; width: 240px; height: 1200px }
  .details { left: 272px; top: 140px; width: 1100px; height: 290px }
  .charts { left: 660px; top: 445px; width: 712px; height: 500px }
  .chat { position: absolute; left: 272px; top: 445px; width: 363px; height: 500px; background: #0a6e5c; border-radius: 0 }
  .chat h3 { margin: 0; padding: 12px 20px; font-size: 15px; display: flex; gap: 8px; align-items: center }
  .chat .list { padding: 0 20px; line-height: 1.6 }
  .chat .typing { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #123456 }
  .chat .typing input { margin: 12px 20px; width: 250px }
  /* X's phone layout: under 900 px wide the chat card falls far down the page, out of any small window */
  @media (max-width: 900px) { .chat { left: 16px; top: 1700px; width: 438px } .side { display: none } }
</style>
<script>
  // id=SIGNEDOUT01 stands for X asking for a sign-in instead of showing the livestream
  if ((new URLSearchParams(location.search).get('id') || '').indexOf('SIGNEDOUT') === 0) addEventListener('DOMContentLoaded', function () { document.body.innerHTML = '<h1>See what\'s happening</h1><p>Sign in to X</p>'; });
  // id=QUIETCHAT01 stands for a livestream nobody has written in yet: the card has its heading and an empty list
  if ((new URLSearchParams(location.search).get('id') || '').indexOf('QUIET') === 0) addEventListener('DOMContentLoaded', function () { document.querySelector('.list').innerHTML = ''; });
  // id=NOCHAT00001 stands for a Live Studio page that has no chat card
  else if ((new URLSearchParams(location.search).get('id') || '').indexOf('NOCHAT') === 0) addEventListener('DOMContentLoaded', function () { document.body.innerHTML = '<h1>Details</h1><p>Visibility: Private</p>'; });
</script>
</head>
<body>
<div class="page">
  <div class="side"><div>Livestreams</div><div>Sources</div></div>
  <div class="details"><h2>Details</h2></div>
  <div class="charts"><h3>Concurrent viewers</h3></div>
  <div class="chat">
    <h3><svg width="18" height="18"><circle cx="9" cy="9" r="7" fill="#fff"/></svg><span>Live Chat</span></h3>
    <div class="list"><div>ana: hello there</div><div>bo: what theme is that?</div><div>cy: love the cursor</div><div>di: is that live?</div><div>ed: hi from Brazil</div><div>fay: nice setup</div></div>
    <div class="typing"><input placeholder="Send a message..."></div>
  </div>
</div>
</body>
</html>
